<title>Nutanix Deals</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one calm reading column like a reminders list. Each deal is a row whose
   steps run as a left-to-right track; edits from other people get a highlighter. */
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --ink: #1a1e27;
  --muted: #646d7e;
  --faint: #9aa2b1;
  --line: #e3e6ec;
  --accent: #2552c4;
  --accent-soft: #e8eefb;
  --done: #23895a;
  --done-soft: #e5f4ec;
  --late: #c93a3a;
  --late-soft: #fbeaea;
  --flag: #e07408;
  --hl: #fff0b8;
  --hl-ink: #7a5300;
  --hl-edge: #e9b316;
  --shadow: 0 1px 2px rgba(20, 30, 50, .06), 0 8px 24px rgba(20, 30, 50, .06);
  --font-ui: "Instrument Sans", ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101217; --surface: #171a21; --ink: #e6e8ee; --muted: #9ba3b3; --faint: #6c7486;
    --line: #2a2f3b; --accent: #7ea2ff; --accent-soft: #1d2741; --done: #4cc38a; --done-soft: #15291f;
    --late: #ff7d7d; --late-soft: #331a1c; --flag: #ff9d42; --hl: #3d3210; --hl-ink: #ffd772; --hl-edge: #c99a1c;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101217; --surface: #171a21; --ink: #e6e8ee; --muted: #9ba3b3; --faint: #6c7486;
  --line: #2a2f3b; --accent: #7ea2ff; --accent-soft: #1d2741; --done: #4cc38a; --done-soft: #15291f;
  --late: #ff7d7d; --late-soft: #331a1c; --flag: #ff9d42; --hl: #3d3210; --hl-ink: #ffd772; --hl-edge: #c99a1c;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
a { color: var(--accent); }
svg { flex: none; }

/* ---------- top bar ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 980px; margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.tabs { display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 3px; gap: 2px; }
.tab { display: flex; align-items: center; gap: 7px; padding: 5px 14px; border-radius: 6px; font-weight: 600; font-size: 14px; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.tab .n { font-variant-numeric: tabular-nums; font-weight: 500; color: var(--faint); font-size: 13px; }
.tab .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--hl-edge); }
.search { flex: 1 1 200px; display: flex; align-items: center; gap: 8px; min-width: 0; max-width: 340px; margin-left: auto;
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; color: var(--faint); }
.search input { border: 0; background: none; outline: none; width: 100%; min-width: 0; color: var(--ink); font-size: 14px; }
.sync { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.sync[data-s="live"] i { background: var(--done); }
.sync[data-s="local"] i { background: var(--flag); }
.sync[data-s="off"] i { background: var(--late); }

/* ---------- page ---------- */
main { max-width: 980px; margin: 0 auto; padding-block: 22px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
.head h1 { margin: 0; font-size: clamp(28px, 5vw, 38px); font-weight: 700; letter-spacing: -.02em; color: var(--accent); text-wrap: balance; }
.head .count { font-size: clamp(28px, 5vw, 38px); font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; }
.subbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  margin-top: 6px; padding-bottom: 10px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.subbar .grp { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.linkbtn { color: var(--accent); font-weight: 500; }
.linkbtn.danger { color: var(--late); }
.subbar select { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; font-size: 13px; }

.banner { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; background: var(--hl); color: var(--hl-ink);
  border: 1px solid var(--hl-edge); border-radius: var(--r); padding: 10px 14px; font-size: 14px; }
.banner .row1 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.banner .row1 strong { font-weight: 600; }
.banner .acts { margin-left: auto; display: flex; gap: 14px; }
.banner button { color: var(--hl-ink); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
.banner .gone { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 13px; }

.notice { margin-top: 14px; padding: 10px 14px; border-radius: var(--r); background: var(--accent-soft); color: var(--ink); font-size: 13.5px; }

.add { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); color: var(--faint); }
.add input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 15.5px; color: var(--ink); }
.add input::placeholder { color: var(--faint); }
.add .plus { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; border: 1.5px dashed var(--faint); }

/* ---------- rows ---------- */
.list { list-style: none; margin: 0; padding: 0; }
.row { position: relative; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 0 10px; padding: 14px 0 16px; border-bottom: 1px solid var(--line); }
.row.upd::before { content: ""; position: absolute; left: -12px; top: 12px; bottom: 12px; width: 3px; border-radius: 3px; background: var(--hl-edge); }
.row.open { background: var(--surface); box-shadow: var(--shadow); border-radius: 12px; border-bottom-color: transparent;
  margin: 8px -12px; padding-inline: 12px; }
.row.open.upd::before { left: 0; }
.circle { width: 22px; height: 22px; margin-top: 1px; border-radius: 50%; border: 1.5px solid var(--faint); display: grid; place-items: center; color: transparent; }
.circle:hover:not(:disabled) { border-color: var(--accent); }
.row.done .circle { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.body { min-width: 0; display: flex; flex-direction: column; gap: 7px; }
.line1 { display: flex; align-items: flex-start; gap: 10px; }
.title { text-align: left; font-size: 16px; font-weight: 600; letter-spacing: -.005em; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.title:hover { color: var(--accent); }
.row.done .title { color: var(--muted); font-weight: 500; }
.icons { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.ibtn { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; color: var(--faint); }
.ibtn:hover:not(:disabled) { background: var(--bg); color: var(--ink); }
.ibtn.on { color: var(--flag); }
.ibtn.info[aria-expanded="true"] { color: var(--accent); background: var(--accent-soft); }

.updchip { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; align-self: flex-start; font-size: 12.5px;
  background: var(--hl); color: var(--hl-ink); border-radius: 999px; padding: 2px 4px 2px 10px; }
.updchip button { font-weight: 600; color: var(--hl-ink); background: color-mix(in srgb, var(--hl-edge) 25%, transparent); border-radius: 999px; padding: 1px 9px; }

.track { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 4px; }
.track > li { display: flex; align-items: center; gap: 4px; min-width: 0; }
.track > li + li::before { content: ""; width: 10px; height: 1.5px; background: var(--line); border-radius: 2px; }
.step { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; text-align: left; font-size: 13.5px; padding: 3px 9px 3px 6px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
.step span { overflow-wrap: anywhere; }
.step .bx { width: 15px; height: 15px; border-radius: 4px; border: 1.5px solid var(--faint); display: grid; place-items: center; color: transparent; }
.step.done { color: var(--ink); border-color: transparent; background: var(--done-soft); }
.step.done .bx { background: var(--done); border-color: var(--done); color: #fff; }
.step.next { border-color: var(--accent); color: var(--ink); font-weight: 600; background: var(--accent-soft); }
.step.next .bx { border-color: var(--accent); }
.step .tag { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); font-weight: 700; }
.step:hover:not(:disabled) { border-color: var(--accent); }
.track.empty { font-size: 13px; color: var(--faint); }

.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.due { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 500; padding: 2px 8px; border-radius: 6px; background: var(--bg); color: var(--muted); font-variant-numeric: tabular-nums; }
.due.today, .due.soon { background: var(--accent-soft); color: var(--accent); }
.due.overdue { background: var(--late-soft); color: var(--late); }
.lnk { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; font-size: 13px; padding: 2px 8px; border-radius: 6px;
  background: var(--bg); color: var(--ink); text-decoration: none; border: 1px solid var(--line); }
.lnk:hover { border-color: var(--accent); color: var(--accent); }
.lnk .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 260px; }
.lnk code, .mono { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }

.checks { display: flex; flex-wrap: wrap; gap: 6px; }
.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 2px 4px 2px 9px; border-radius: 6px;
  border: 1px solid var(--line); color: var(--muted); background: var(--surface); }
.chk b { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; background: var(--bg); color: var(--faint); }
.chk.yes { color: var(--ink); }
.chk.yes b { background: var(--done); color: #fff; }
.chk:hover:not(:disabled) { border-color: var(--accent); }

.note { margin: 0; font-size: 13.5px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row.open .note { display: none; }

/* changed-by-someone-else highlighter */
.hl { background: var(--hl) !important; color: var(--hl-ink) !important; box-shadow: 0 0 0 1px var(--hl-edge) inset; border-color: transparent !important; }
.title.hl, .note.hl { box-shadow: none; border-radius: 4px; padding: 0 4px; margin-left: -4px; }
.track.hl { padding: 4px; border-radius: 8px; }

/* ---------- editor ---------- */
.ed { display: flex; flex-direction: column; gap: 18px; margin-top: 8px; padding-top: 14px; border-top: 1px dashed var(--line); }
.ed section { display: flex; flex-direction: column; gap: 8px; }
.ed h3 { margin: 0; font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.fld { width: 100%; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; font-size: 14.5px; outline: none; }
.fld:focus { border-color: var(--accent); background: var(--surface); }
.fld.title-in { font-size: 17px; font-weight: 600; }
textarea.fld { resize: vertical; min-height: 70px; line-height: 1.45; }
.srow { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; align-items: center; gap: 8px; border-radius: 8px; }
.srow.hl { padding: 3px; }
.srow input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--done); margin: 0; }
.srow .fld { padding: 5px 9px; }
.srow .tools { display: flex; gap: 2px; }
.lrow { display: grid; grid-template-columns: minmax(90px, 0.6fr) minmax(0, 1.4fr) auto; gap: 8px; align-items: center; border-radius: 8px; }
.lrow.hl { padding: 3px; }
.addline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.addline .fld { flex: 1 1 200px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); font-size: 13.5px; font-weight: 500; }
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.primary:hover { color: var(--surface); filter: brightness(1.08); }
.btn.danger { color: var(--late); }
.btn.danger.solid { background: var(--late); border-color: var(--late); color: #fff; }
.sugs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; color: var(--faint); }
.sug { font-size: 12.5px; padding: 2px 9px; border-radius: 999px; border: 1px dashed var(--faint); color: var(--muted); }
.sug:hover { border-style: solid; border-color: var(--accent); color: var(--accent); }
.duegrid { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.duegrid .fld { width: auto; flex: 0 1 180px; }
.duegrid.hl { padding: 4px; border-radius: 8px; }
.cgrid { display: flex; flex-direction: column; gap: 6px; }
.crow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 10px; border-radius: 8px; background: var(--bg); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; flex: none; }
.seg button { padding: 3px 14px; font-size: 13px; font-weight: 600; color: var(--muted); background: var(--surface); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"].no { background: var(--muted); color: var(--surface); }
.seg button[aria-pressed="true"].yes { background: var(--done); color: #fff; }
.edfoot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-top: 12px; border-top: 1px solid var(--line); }
.edfoot .who { font-size: 12.5px; color: var(--faint); flex: 1 1 200px; }
.confirm { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--late); }

.empty { padding: 48px 8px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20;
  background: var(--ink); color: var(--surface); padding: 9px 16px; border-radius: 8px; font-size: 13.5px; box-shadow: var(--shadow); max-width: calc(100% - 32px); }

body.ro .add, body.ro .ed .writer, body.ro #clearDone { display: none; }

@media (max-width: 560px) {
  .search { order: 3; max-width: none; flex-basis: 100%; }
  .lrow { grid-template-columns: minmax(0, 1fr) auto; }
  .lrow .fld:first-child { grid-column: 1 / -1; }
  .row.open { margin-inline: -8px; padding-inline: 8px; }
  .row.upd::before { left: -9px; }
}
@media (prefers-reduced-motion: no-preference) {
  .row, .step, .chk, .circle { transition: background-color .15s, border-color .15s, box-shadow .15s; }
}
</style>

<header class="top">
  <div class="top-in">
    <div class="tabs" role="tablist" aria-label="Lists">
      <button class="tab" role="tab" id="tab-deals" data-view="deals">Deals <span class="n" id="n-deals"></span><span class="dot" id="d-deals" hidden></span></button>
      <button class="tab" role="tab" id="tab-tasks" data-view="tasks">Tasks <span class="n" id="n-tasks"></span><span class="dot" id="d-tasks" hidden></span></button>
    </div>
    <label class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search deals, steps, links" autocomplete="off"></label>
    <span class="sync" id="sync" data-s="wait"><i></i><span>Connecting…</span></span>
  </div>
</header>

<main>
  <div class="head"><h1 id="h1">Nutanix Deals</h1><span class="count" id="count"></span></div>
  <div class="subbar">
    <div class="grp" id="doneGrp"></div>
    <div class="grp"><label for="sort">Sort</label>
      <select id="sort">
        <option value="due">Next due</option>
        <option value="flag">Flagged first</option>
        <option value="updated">Recently edited</option>
        <option value="name">Name</option>
      </select>
    </div>
  </div>
  <div id="banner"></div>
  <div id="notice"></div>
  <label class="add" id="addRow"><span class="plus"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
    <input id="addIn" type="text" placeholder="New deal — type a name and press Enter" autocomplete="off"></label>
  <ul class="list" id="list"></ul>
  <div class="empty" id="empty" hidden></div>
</main>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
'use strict';

/* ================= constants & helpers ================= */
const CHECKS = [
  { key: 'notes', label: 'Updated Nutanix Recent Notes', short: 'Recent notes' },
  { key: 'strategy', label: 'Implementation Strategy', short: 'Impl. strategy' },
  { key: 'plan', label: 'Implementation Plan', short: 'Impl. plan' },
];
const VIEWS = {
  deals: { h1: 'Nutanix Deals', noun: 'deal', nouns: 'deals', add: 'New deal — type a name and press Enter' },
  tasks: { h1: 'Tasks', noun: 'task', nouns: 'tasks', add: 'New task — type it and press Enter' },
};
const I = {
  check: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17 19 7"/></svg>',
  clock: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  link: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>',
  flag: '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3h1.8v18H5zM8 4h11l-2.5 4.5L19 13H8z"/></svg>',
  flagOff: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5.9 3v18M8 4h11l-2.5 4.5L19 13H8z"/></svg>',
  info: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg>',
  up: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>',
  down: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',

        onclick: () => commit(kind, it.id, (d) => { const x = (d.steps || []).find((y) => y.id === s.id); if (x) x.done = !x.done; }) },
        h('i', { class: 'bx', icon: 'check' }), h('span', { text: s.text || 'Untitled step' }));
      if (i === nextIdx && !it.completed) b.append(h('span', { class: 'tag', text: 'Next' }));
      ol.append(h('li', null, b));
    });
    body.append(ol);
  }
  // due + links
  const meta = h('div', { class: 'meta' });
  const fd = fmtDue(it.due);
  if (fd && !it.completed) meta.append(h('span', { class: 'due ' + fd.state + (F.has('due') ? ' hl' : ''), icon: 'clock' }, fd.label));
  else if (fd) meta.append(h('span', { class: 'due' + (F.has('due') ? ' hl' : ''), icon: 'clock' }, fd.label));
  for (const l of it.links || []) {
    const url = safeUrl(l.url); if (!url) continue;
    const sid = sizerId(url);
    meta.append(h('a', { class: 'lnk' + (F.has('link:' + l.id) ? ' hl' : ''), href: url, target: '_blank', rel: 'noopener noreferrer', title: url, icon: 'link' },
      h('span', { class: 'lbl', text: l.label || (sid ? 'Sizer' : hostOf(url)) }), sid ? h('code', { text: sid }) : null, h('span', { icon: 'ext' })));
  }
  if (F.has('links')) meta.classList.add('hl');
  if (meta.children.length) body.append(meta);
  // yes/no checklist
  if (kind === 'deals') {
    const ck = h('div', { class: 'checks' });
    for (const c of CHECKS) {
      const yes = !!(it.checks || {})[c.key];
      ck.append(h('button', { class: 'chk' + (yes ? ' yes' : '') + (F.has('check:' + c.key) ? ' hl' : ''), title: `${c.label}: ${yes ? 'Yes' : 'No'}${S.canWrite ? ' (click to change)' : ''}`,
        disabled: !S.canWrite, 'aria-label': `${c.label}: ${yes ? 'Yes' : 'No'}`,
        onclick: () => commit(kind, it.id, (d) => { d.checks = { ...(d.checks || {}), [c.key]: !yes }; }) },
        h('span', { text: c.short }), h('b', { text: yes ? 'Yes' : 'No' })));
    }
    body.append(ck);
  }
  if (it.notes) body.append(h('p', { class: 'note' + (F.has('notes') ? ' hl' : ''), text: it.notes }));
  sum.append(...body.childNodes);
  sum.style.display = 'contents';
  li.querySelector('.slot').style.display = 'contents';
  if (isOpen && ED.el && ED.el.parentNode !== li.querySelector('.slot')) li.querySelector('.slot').append(ED.el);
}

function renderBanner() {
  const el = $('#banner'); el.replaceChildren();
  const all = allUnseen();
  if (!all.length) return;
  const live = all.filter((x) => !x.it.deleted);
  const gone = all.filter((x) => x.it.deleted && x.u.fields.has('deleted'));
  const people = [...new Set(all.map((x) => personName(x.u.by)))];
  const nd = live.filter((x) => x.kind === 'deals').length, nt = live.filter((x) => x.kind === 'tasks').length;
  const parts = [];
  if (nd) parts.push(`${nd} ${nd === 1 ? 'deal' : 'deals'}`);
  if (nt) parts.push(`${nt} ${nt === 1 ? 'task' : 'tasks'}`);
  if (gone.length) parts.push(`deleted ${gone.length}`);
  const box = h('div', { class: 'banner', role: 'status' });
  box.append(h('div', { class: 'row1' },
    h('span', null, h('strong', { text: people.join(' and ') }), ` made changes since you last looked: ${parts.join(', ')}. Changes are highlighted below.`),
    h('div', { class: 'acts' },
      live.some((x) => x.kind !== S.view) ? h('button', { text: `View ${S.view === 'deals' ? 'tasks' : 'deals'}`, onclick: () => go(S.view === 'deals' ? 'tasks' : 'deals') }) : null,
      h('button', { text: 'Mark all seen', onclick: () => markSeen(all.map((x) => [x.kind, x.it.id])) }))));
  if (gone.length) {
    const g = h('div', { class: 'gone' });
    for (const x of gone) g.append(h('span', null, `${personName(x.u.by)} deleted “${x.it.title || 'Untitled'}”`), S.canWrite ? h('button', { text: 'Restore', onclick: () => commit(x.kind, x.it.id, (d) => { d.deleted = false; }) }) : null);
    box.append(g);
  }
  el.append(box);
}

function renderNotice() {
  const el = $('#notice'); el.replaceChildren();
  let msg = '';
  if (S.mode === 'local') msg = 'You opened this file outside claude.ai, so changes are saved in this browser only. Open the shared link to work with your account executive.';
  else if (S.mode === 'off') msg = 'This list needs you to be signed in to claude.ai to load shared deals.';
  else if (S.mode === 'live' && !S.canWrite) msg = 'You can view this list but not change it. Ask the owner for Contributor or Editor access to make edits.';
  else if (S.mode === 'live' && !S.me) msg = 'Edit highlights need a signed-in account, so they’re off for this visit.';
  if (msg) el.append(h('div', { class: 'notice', text: msg }));
}

function clearDone() {
  S.confirmClear = false;
  for (const it of S.items[S.view].values()) if (it.completed && !it.deleted) commit(S.view, it.id, (d) => { d.deleted = true; });
  render();
}

/* ================= editor ================= */
function openEditor(kind, id) {
  if (ED) closeEditor(true);
  const it = S.items[kind].get(id); if (!it) return;
  const { list } = visible(kind);
  S.frozen = { kind, order: new Map(list.map((x, i) => [x.id, i])) };
  ED = { kind, id, base: clone(it), draft: clone(it), dirty: false, timer: null, el: h('div', { class: 'ed' }), confirmDel: false };
  buildEditor();
  render();
  const li = rowEls.get(kind + '/' + id);
  if (li && li.scrollIntoView) li.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function closeEditor(silent) {
  if (!ED) return;
  flushEditor();
  ED.el.remove();
  ED = null; S.frozen = null;
  if (!silent) render();
}
function scheduleSave() {
  ED.dirty = true;
  clearTimeout(ED.timer);
  ED.timer = setTimeout(flushEditor, 700);
}
function flushEditor() {
  if (!ED) return;
  clearTimeout(ED.timer);
  if (!ED.dirty) return;
  ED.dirty = false;
  persist(ED.kind, ED.id, ED.base, ED.draft);
  ED.base = clone(ED.draft);
}
function structural(fn) { fn(); flushEditorNow(); buildEditor(); }
function flushEditorNow() { ED.dirty = true; flushEditor(); }

function buildEditor() {
  if (!ED) return;
  const { kind, draft: d } = ED;
  const live = S.items[kind].get(ED.id) || d;
  const u = unseen(kind, live); const F = u ? u.fields : new Set();
  const ro = !S.canWrite;
  const el = ED.el; el.replaceChildren();

  el.append(h('section', null, h('h3', { text: 'Name' }),
    h('input', { class: 'fld title-in' + (F.has('title') ? ' hl' : ''), id: 'ed-title', value: d.title || '', placeholder: kind === 'deals' ? 'Customer and deal' : 'What needs doing', disabled: ro,
      oninput: (e) => { d.title = e.target.value; scheduleSave(); } })));

  if (kind === 'deals') {
    const sec = h('section', null, h('h3', { text: 'Steps' }));
    const steps = d.steps ||= [];
    steps.forEach((s, i) => {
      sec.append(h('div', { class: 'srow' + (F.has('step:' + s.id) ? ' hl' : '') },
        h('input', { type: 'checkbox', checked: !!s.done, disabled: ro, 'aria-label': 'Done', onchange: (e) => structural(() => { s.done = e.target.checked; }) }),
        h('input', { class: 'fld', value: s.text || '', disabled: ro, 'aria-label': 'Step', id: 'ed-step-' + s.id,
          oninput: (e) => { s.text = e.target.value; scheduleSave(); },
          onkeydown: (e) => { if (e.key === 'Enter') { e.preventDefault(); $('#ed-newstep') && $('#ed-newstep').focus(); } } }),
        h('div', { class: 'tools writer' },
          h('button', { class: 'ibtn', icon: 'up', title: 'Move up', 'aria-label': 'Move up', disabled: i === 0, onclick: () => structural(() => { steps.splice(i - 1, 0, steps.splice(i, 1)[0]); }) }),
          h('button', { class: 'ibtn', icon: 'down', title: 'Move down', 'aria-label': 'Move down', disabled: i === steps.length - 1, onclick: () => structural(() => { steps.splice(i + 1, 0, steps.splice(i, 1)[0]); }) }),
          h('button', { class: 'ibtn', icon: 'x', title: 'Remove step', 'aria-label': 'Remove step', onclick: () => structural(() => { steps.splice(i, 1); }) }))));
    });
    const addStep = (text) => { text = text.trim(); if (!text) return; structural(() => { steps.push({ id: rid(), text, done: false }); }); const n = $('#ed-newstep'); if (n) n.focus(); };
    const inp = h('input', { class: 'fld', id: 'ed-newstep', placeholder: 'Add a step and press Enter', onkeydown: (e) => { if (e.key === 'Enter') { e.preventDefault(); addStep(e.target.value); } } });
    sec.append(h('div', { class: 'addline writer' }, inp, h('button', { class: 'btn', icon: 'plus', onclick: () => addStep(inp.value) }, 'Add step')));
    const have = new Set(steps.map((s) => (s.text || '').trim().toLowerCase()));
    const freq = new Map();
    for (const it of S.items.deals.values()) for (const s of it.steps || []) { const t = (s.text || '').trim(); if (t && !have.has(t.toLowerCase())) freq.set(t, (freq.get(t) || 0) + 1); }
    const top = [...freq.entries()].filter(([, n]) => n > 1).sort((a, b) => b[1] - a[1]).slice(0, 6);
    if (top.length) sec.append(h('div', { class: 'sugs writer' }, 'Common steps:', top.map(([t]) => h('button', { class: 'sug', text: t, onclick: () => addStep(t) }))));
    el.append(sec);
  }

  // due
  const [dDate, dTime] = (d.due || '').split('T');
  const setDue = () => {
    const date = $('#ed-date').value, time = $('#ed-time').value;
    d.due = date ? (time ? date + 'T' + time : date) : '';
    scheduleSave();
  };
  el.append(h('section', null, h('h3', { text: kind === 'deals' ? 'Next step due' : 'Due' }),
    h('div', { class: 'duegrid' + (F.has('due') ? ' hl' : '') },
      h('input', { class: 'fld', type: 'date', id: 'ed-date', value: dDate || '', disabled: ro, 'aria-label': 'Date', onchange: setDue }),
      h('input', { class: 'fld', type: 'time', id: 'ed-time', value: dTime || '', disabled: ro, 'aria-label': 'Time (optional)', onchange: setDue }),
      d.due && !ro ? h('button', { class: 'btn', text: 'Clear', onclick: () => structural(() => { d.due = ''; }) }) : null)));

  // links
  const lsec = h('section', null, h('h3', { text: 'Links' }));
  const links = d.links ||= [];
  links.forEach((l, i) => {
    lsec.append(h('div', { class: 'lrow' + (F.has('link:' + l.id) ? ' hl' : '') },
      h('input', { class: 'fld', value: l.label || '', placeholder: 'Label (e.g. Hybrid)', disabled: ro, 'aria-label': 'Link label', id: 'ed-ll-' + l.id, oninput: (e) => { l.label = e.target.value; scheduleSave(); } }),
      h('input', { class: 'fld mono', value: l.url || '', placeholder: 'https://sizer.nutanix.com/#/scenario/S-…', disabled: ro, 'aria-label': 'Link URL', id: 'ed-lu-' + l.id, inputmode: 'url', oninput: (e) => { l.url = e.target.value; scheduleSave(); } }),
      h('button', { class: 'ibtn writer', icon: 'x', title: 'Remove link', 'aria-label': 'Remove link', onclick: () => structural(() => { links.splice(i, 1); }) })));
  });
  lsec.append(h('div', { class: 'addline writer' }, h('button', { class: 'btn', icon: 'plus', onclick: () => {
    const nl = { id: rid(), label: '', url: '' };
    links.push(nl); buildEditor(); const f = $('#ed-ll-' + nl.id); if (f) f.focus();
  } }, 'Add link')));
  el.append(lsec);

  if (kind === 'deals') {
    const c = h('section', null, h('h3', { text: 'Checklist' }));
    const g = h('div', { class: 'cgrid' });
    for (const ch of CHECKS) {
      const yes = !!(d.checks || {})[ch.key];
      const pick = (v) => structural(() => { d.checks = { ...(d.checks || {}), [ch.key]: v }; });
      g.append(h('div', { class: 'crow' + (F.has('check:' + ch.key) ? ' hl' : '') }, h('span', { text: ch.label }),
        h('div', { class: 'seg', role: 'group', 'aria-label': ch.label },
          h('button', { class: 'no', 'aria-pressed': String(!yes), disabled: ro, text: 'No', onclick: () => pick(false) }),
          h('button', { class: 'yes', 'aria-pressed': String(yes), disabled: ro, text: 'Yes', onclick: () => pick(true) }))));
    }
    c.append(g); el.append(c);
  }

  el.append(h('section', null, h('h3', { text: 'Notes' }),
    h('textarea', { class: 'fld' + (F.has('notes') ? ' hl' : ''), id: 'ed-notes', rows: '3', disabled: ro, placeholder: 'Context, next steps, who you’re waiting on…', oninput: (e) => { d.notes = e.target.value; scheduleSave(); } }, d.notes || '')));

  const who = [];
  if (live.createdBy || live.createdAt) who.push(`Added by ${personName(live.createdBy)}${live.createdAt ? ' ' + ago(live.createdAt) : ''}`);
  if (live.updatedAt && live.updatedAt !== live.createdAt) who.push(`last edited by ${personName(live.updatedBy)} ${ago(live.updatedAt)}`);
  const foot = h('div', { class: 'edfoot' }, h('span', { class: 'who', text: who.join(' · ') }));
  if (!ro) {
    if (ED.confirmDel) foot.append(h('span', { class: 'confirm' }, `Delete this ${VIEWS[kind].noun}?`,
      h('button', { class: 'btn danger solid', text: 'Delete', onclick: () => { const id = ED.id; commit(kind, id, (x) => { x.deleted = true; }); closeEditor(); toast(`Deleted. ${VIEWS[kind].noun === 'deal' ? 'Deal' : 'Task'} removed from the list.`); } }),
      h('button', { class: 'btn', text: 'Cancel', onclick: () => { ED.confirmDel = false; buildEditor(); } })));
    else foot.append(h('button', { class: 'btn danger', text: 'Delete', onclick: () => { ED.confirmDel = true; buildEditor(); } }));
  }
  foot.append(h('button', { class: 'btn primary', text: 'Done', onclick: () => closeEditor() }));
  el.append(foot);
  ED.shown = JSON.stringify(live);
}

/* react to remote changes for the open item without disturbing typing */
function syncEditor() {
  if (!ED) return;
  const it = S.items[ED.kind].get(ED.id);
  if (!it) { closeEditor(true); return; }
  if (ED.dirty || ED.el.contains(document.activeElement)) return;
  const s = JSON.stringify(it);
  if (s === ED.shown) return;
  ED.base = clone(it); ED.draft = clone(it);
  buildEditor();
}
document.addEventListener('focusout', () => setTimeout(syncEditor, 50));

/* ================= misc ui ================= */
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3800); }
function go(view) {
  if (!VIEWS[view]) view = 'deals';
  if (ED && ED.kind !== view) closeEditor(true);
  S.view = view; S.confirmClear = false;
  try { if (location.hash !== '#' + view) history.replaceState(null, '', '#' + view); } catch {}
  render();
}
document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => go(t.dataset.view)));
window.addEventListener('hashchange', () => go(location.hash.slice(1)));
$('#q').addEventListener('input', (e) => { S.q = e.target.value; if (ED) closeEditor(true); render(); });
$('#sort').value = S.sort;
$('#sort').addEventListener('change', (e) => { S.sort = e.target.value; ls.set('crm.sort', S.sort); render(); });
$('#addIn').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const v = e.target.value.trim(); if (!v || !S.store) return;
  e.preventDefault();
  const kind = S.view, id = createItem(kind, v);
  e.target.value = '';
  if (kind === 'deals') {
    const tryOpen = (n) => { if (S.items.deals.has(id)) { openEditor('deals', id); const f = $('#ed-newstep'); if (f) f.focus(); } else if (n < 40) setTimeout(() => tryOpen(n + 1), 50); };
    tryOpen(0);
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && ED) closeEditor(); });
setInterval(() => { if (!ED || !ED.el.contains(document.activeElement)) render(); }, 60000);

/* ================= boot ================= */
async function boot() {
  go(location.hash.slice(1) || 'deals');
  const timer = setTimeout(() => { S.timedOut = true; render(); }, 10000);
  let store = null;
  if (window.claude && typeof window.claude.use === 'function') {
    try { store = await remoteStore(); } catch (e) { console.warn(e); }
    if (!store) { clearTimeout(timer); S.mode = 'off'; S.timedOut = true; S.canWrite = false; render(); return; }
  } else store = localStore();
  S.store = store; S.me = store.me; S.canWrite = store.canWrite; S.mode = store.mode;
  render();
  for (const kind of ['deals', 'tasks']) {
    store.sub(kind, (docs) => {
      const m = new Map(docs.map((d) => [d.id, d]));
      S.items[kind] = m; S.loaded[kind] = true;
      if (S.loaded.deals && S.loaded.tasks) clearTimeout(timer);
      render(); syncEditor();
    }, (err) => { console.warn(err); S.loaded[kind] = true; toast('Lost the connection to the shared list. Reload the page to reconnect.'); render(); });
  }
  store.subUser((data, fromCache) => {
    if (data) { S.user = { baseline: data.baseline || 0, seen: data.seen || {} }; S.userExists = true; S.userLoaded = true; }
    else if (!fromCache) {
      S.userExists = false; S.userLoaded = true;
      if (S.me && !S.user.baseline) {
        // first visit: start highlighting from now so existing items aren't all flagged as new
        S.user = { baseline: Date.now(), seen: {} };
        enqueue('user', () => store.setUser(S.user)).then(() => { S.userExists = true; }).catch((e) => console.warn(e));
      }
    }
    render();
  });
}
boot();
})();
</script>
