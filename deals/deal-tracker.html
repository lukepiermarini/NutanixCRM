<title>Nutanix Deals</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<style>
/* Layout: one calm reading column like a reminders list. Each deal is a row whose
   steps run as a left-to-right track; edits from the other person get an aqua highlighter.
   Brand: lead with white and Charcoal Gray, Iris Purple for accents and rules, secondary
   colors (Mantis Green, Aqua Blue, Peach Pink) only as small status highlights. One typeface. */
:root {
  /* core brand */
  --charcoal: #131313;
  --iris: #7855FA;
  --page: #ffffff;
  --bg: #f5f5f7;
  --surface: #ffffff;
  --ink: #131313;
  --muted: #55545e;
  --faint: #8e8c9a;
  --line: #e6e5ec;
  --rule: #7855FA;
  --accent: #7855FA;
  --accent-text: #5b37e6;
  --accent-soft: #f1edff;
  --on-accent: #ffffff;
  --link: #1769e0;
  /* secondary, used only as highlights */
  --done: #92DD23;
  --on-done: #131313;
  --done-soft: #eef9dc;
  --flag: #FF9178;
  --hl: #d8f8fa;
  --hl-ink: #0a4a4f;
  --hl-edge: #1FDDE9;
  /* status */
  --late: #d63a3a;
  --late-soft: #fdecec;
  --amber: #d99100;
  --shadow: 0 1px 2px rgba(19, 19, 19, .06), 0 10px 28px rgba(19, 19, 19, .07);
  --font-ui: "Montserrat", Arial, ui-sans-serif, system-ui, sans-serif;
  --font-mono: "Montserrat", Arial, ui-sans-serif, system-ui, sans-serif;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #131313; --bg: #1d1d21; --surface: #19191c; --ink: #ffffff; --muted: #aeacba; --faint: #737181; --line: #2d2c34; --rule: #7855FA;
    --accent: #8466ff; --accent-text: #a891ff; --accent-soft: #241d43; --on-accent: #ffffff; --link: #5ba4ff;
    --done: #92DD23; --on-done: #131313; --done-soft: #1f2a12; --late: #ff6464; --late-soft: #3a1717; --amber: #f2b531; --flag: #FF9178;
    --hl: #0f3a3d; --hl-ink: #a5f4f8; --hl-edge: #1FDDE9;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 10px 28px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #131313; --bg: #1d1d21; --surface: #19191c; --ink: #ffffff; --muted: #aeacba; --faint: #737181; --line: #2d2c34; --rule: #7855FA;
  --accent: #8466ff; --accent-text: #a891ff; --accent-soft: #241d43; --on-accent: #ffffff; --link: #5ba4ff;
  --done: #92DD23; --on-done: #131313; --done-soft: #1f2a12; --late: #ff6464; --late-soft: #3a1717; --amber: #f2b531; --flag: #FF9178;
  --hl: #0f3a3d; --hl-ink: #a5f4f8; --hl-edge: #1FDDE9;
  --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 10px 28px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

/* Theme picked with the page's own Light / Dark switch; overrides the system and host theme. */
:root[data-ui-theme="light"] {
  --page: #ffffff; --bg: #f5f5f7; --surface: #ffffff; --ink: #131313; --muted: #55545e; --faint: #8e8c9a; --line: #e6e5ec; --rule: #7855FA;
  --accent: #7855FA; --accent-text: #5b37e6; --accent-soft: #f1edff; --on-accent: #ffffff; --link: #1769e0;
  --done: #92DD23; --on-done: #131313; --done-soft: #eef9dc; --late: #d63a3a; --late-soft: #fdecec; --amber: #d99100; --flag: #FF9178;
  --hl: #d8f8fa; --hl-ink: #0a4a4f; --hl-edge: #1FDDE9;
  --shadow: 0 1px 2px rgba(19, 19, 19, .06), 0 10px 28px rgba(19, 19, 19, .07);
  color-scheme: light;
}
:root[data-ui-theme="dark"] {
  --page: #131313; --bg: #1d1d21; --surface: #19191c; --ink: #ffffff; --muted: #aeacba; --faint: #737181; --line: #2d2c34; --rule: #7855FA;
  --accent: #8466ff; --accent-text: #a891ff; --accent-soft: #241d43; --on-accent: #ffffff; --link: #5ba4ff;
  --done: #92DD23; --on-done: #131313; --done-soft: #1f2a12; --late: #ff6464; --late-soft: #3a1717; --amber: #f2b531; --flag: #FF9178;
  --hl: #0f3a3d; --hl-ink: #a5f4f8; --hl-edge: #1FDDE9;
  --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 10px 28px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--page); color: var(--ink); font-family: var(--font-ui); font-size: 14.5px; line-height: 1.6; font-variant-numeric: tabular-nums; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
a { color: var(--accent-text); }
svg { flex: none; }

/* ---------- top bar ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px), 2.5vw); padding-right: max(16px, env(safe-area-inset-right, 0px), 2.5vw); }
.theme { display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 2px; gap: 2px; }
.theme button { display: flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 6px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.theme button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.theme button:hover { color: var(--ink); }
.tabs { display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 3px; gap: 2px; }
.tab { display: flex; align-items: center; gap: 7px; padding: 5px 15px; border-radius: 6px; font-weight: 600; font-size: 13.5px; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--page); }
.tab[aria-selected="true"] .n { color: inherit; opacity: .7; }
.tab .n { font-variant-numeric: tabular-nums; font-weight: 500; color: var(--faint); font-size: 13px; }
.tab .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--hl-edge); }
.search { flex: 1 1 200px; display: flex; align-items: center; gap: 8px; min-width: 0; max-width: 420px; margin-left: auto;
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; color: var(--faint); }
.search input { border: 0; background: none; outline: none; width: 100%; min-width: 0; color: var(--ink); font-size: 14px; }
.sync { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.sync[data-s="live"] i { background: var(--done); }
.sync[data-s="local"] i { background: var(--flag); }
.sync[data-s="off"] i { background: var(--late); }

/* ---------- page ---------- */
main { padding-block: 22px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px), 2.5vw); padding-right: max(16px, env(safe-area-inset-right, 0px), 2.5vw); }
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
.head h1 { margin: 0; font-size: clamp(26px, 4.6vw, 36px); font-weight: 700; letter-spacing: -.01em; color: var(--ink); text-wrap: balance; }
.head .count { font-size: clamp(26px, 4.6vw, 36px); font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.subbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  margin-top: 8px; padding-bottom: 12px; border-bottom: 1px solid var(--rule); font-size: 13px; color: var(--muted); }
.subbar .grp { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.linkbtn { color: var(--accent-text); font-weight: 600; }
.linkbtn.danger { color: var(--late); }
.subbar select { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; font-size: 13px; }

.banner { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; background: var(--hl); color: var(--hl-ink);
  border: 1px solid var(--hl-edge); border-radius: var(--r); padding: 10px 14px; font-size: 14px; }
.banner .row1 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.banner .row1 strong { font-weight: 600; }
.banner .acts { margin-left: auto; display: flex; gap: 14px; }
.banner button { color: var(--hl-ink); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
.banner .gone { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 13px; }

.notice { margin-top: 14px; padding: 10px 14px; border-radius: var(--r); background: var(--accent-soft); color: var(--ink); font-size: 13.5px; }

.add { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); color: var(--faint); }
.add input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 15.5px; color: var(--ink); }
.add input::placeholder { color: var(--faint); }
.add .plus { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; border: 1.5px dashed var(--faint); }

/* ---------- rows ---------- */
.list { list-style: none; margin: 0; padding: 0; }
.row { position: relative; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 0 12px; padding: 22px 0 24px; border-bottom: 2px solid color-mix(in srgb, var(--ink) 32%, var(--line)); }
.row.upd::before { content: ""; position: absolute; left: -12px; top: 18px; bottom: 18px; width: 3px; border-radius: 3px; background: var(--hl-edge); }
.row.open { background: var(--surface); box-shadow: var(--shadow); border-radius: 12px; border-bottom-color: transparent;
  margin: 10px -14px; padding-inline: 14px; }
.row.open.upd::before { left: 0; }
.circle { width: 22px; height: 22px; margin-top: 1px; border-radius: 50%; border: 1.5px solid var(--faint); display: grid; place-items: center; color: transparent; }
.circle:hover:not(:disabled) { border-color: var(--accent); }
.row.done .circle { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.body { min-width: 0; display: flex; flex-direction: column; gap: 13px; }
.line1 { display: flex; align-items: flex-start; flex-wrap: wrap; gap: 8px 10px; }
.title { text-align: left; font-size: 16px; line-height: 1.4; font-weight: 600; letter-spacing: -.005em; flex: 0 1 auto; min-width: 0; overflow-wrap: anywhere; }
.title:hover { color: var(--accent-text); }
.row.done .title { color: var(--muted); font-weight: 500; }
.icons { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.ibtn { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; color: var(--faint); }
.ibtn:hover:not(:disabled) { background: var(--bg); color: var(--ink); }
.ibtn.on { color: var(--flag); }
.ibtn.info[aria-expanded="true"] { color: var(--accent); background: var(--accent-soft); }

.updchip { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; align-self: flex-start; font-size: 12.5px;
  background: var(--hl); color: var(--hl-ink); border-radius: 999px; padding: 2px 4px 2px 10px; }
.updchip button { font-weight: 600; color: var(--hl-ink); background: color-mix(in srgb, var(--hl-edge) 25%, transparent); border-radius: 999px; padding: 1px 9px; }

.track { list-style: none; margin: 9px 0; padding: 0;   /* extra room above (progress bars) and below (step dates → links) */
  display: flex; flex-wrap: wrap; align-items: flex-start; gap: 10px 5px; }
.track > li { display: flex; align-items: flex-start; gap: 4px; min-width: 0; }
.track > li + li::before { content: ""; flex: none; width: 12px; height: 1.5px; margin-top: 15.5px; background: var(--line); border-radius: 2px; }
.scol { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-width: 0; }
.step { display: inline-flex; align-items: stretch; max-width: 100%; min-width: 200px; min-height: 32px; font-size: 13px;   /* never narrower than a "Meeting with Wilden" pill, so details under steps don't collide */
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
.step .bx { display: grid; place-items: center; padding: 0 3px 0 9px; border-radius: 999px 0 0 999px; }
.step .box { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--faint); display: grid; place-items: center; color: transparent; }
.step .bx:hover:not(:disabled) .box { border-color: var(--accent); }
.step .slabel { flex: 1; display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px 4px 5px; text-align: left; color: inherit; font-weight: inherit; border-radius: 0 999px 999px 0; }
.step .stext { overflow-wrap: anywhere; }
.step.done { color: var(--ink); border-color: transparent; background: var(--done-soft); }
.step.done .box { background: var(--done); border-color: var(--done); color: var(--on-done); }
.step.next { border-color: var(--accent); color: var(--ink); font-weight: 600; background: var(--accent-soft); }
.step.next .box { border-color: var(--accent); }
.step { position: relative; }
body:not(.ro) .step .slabel { padding-right: 30px; }   /* room for the hover pencil, so it never covers the name */
.sedit { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; display: grid; place-items: center;
  border-radius: 50%; background: var(--surface); color: var(--muted); box-shadow: 0 0 0 1px var(--line), 0 1px 3px rgba(19, 19, 19, .12);
  opacity: 0; pointer-events: none; }
.step:hover .sedit, .step:focus-within .sedit { opacity: 1; pointer-events: auto; }
.sedit:hover { color: var(--accent-text); box-shadow: 0 0 0 1px var(--accent); }
.step.editing { border-color: var(--accent); background: var(--surface); -webkit-user-select: text; user-select: text; }
.stepedit-in { border: 0; background: none; outline: none; font: inherit; color: var(--ink); padding: 4px 12px 4px 5px; min-width: 120px; max-width: 100%; }
/* Land & Expand / Renewal toggle beside a deal's name */
.dtype { flex: none; display: inline-flex; margin-top: -1px; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--surface); }
.dtype button { padding: 3px 10px; font-size: 11.5px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.dtype button + button { border-left: 1px solid var(--line); }
.dtype button:hover:not(:disabled) { color: var(--ink); background: var(--bg); }
.dtype button[aria-pressed="true"].land { background: var(--accent); color: var(--on-accent); }
.dtype button[aria-pressed="true"].renewal { background: var(--ink); color: var(--page); }
.dtype.hl { box-shadow: 0 0 0 2px var(--hl-edge); }
/* Deal progress: two capsule-shaped progress bars. Sales Stage spans eight equal stage columns; Tech Close
   spans the first five (it ends at Stage 5) and splits them into six equal cells. Hovering a cell explains it. */
.prog { --barh: 26px; --pgap: 5px; --colmin: 26px;
  /* grows into the free space on the title line (up to 720px); if less than 440px is left it moves to its own line */
  flex: 1 1 440px; min-width: 0; max-width: min(720px, 100%); display: inline-grid; align-items: center; row-gap: var(--pgap);
  grid-template-columns: auto repeat(8, minmax(var(--colmin), 1fr)) auto; margin-top: -4px; padding: 2px 4px; border-radius: 8px; }
.plbl { grid-column: 1; padding-right: 8px; font-size: 10.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); white-space: nowrap; text-align: right; }
.pbar { height: var(--barh); display: grid; gap: 2px; padding: 2px; border-radius: 999px; border: 1.5px solid var(--accent); background: var(--surface); }
.pbar.st { grid-row: 1; grid-column: 2 / span 8; grid-template-columns: repeat(8, minmax(0, 1fr)); }
.pbar.tc { grid-row: 2; grid-column: 2 / span 5; grid-template-columns: repeat(6, minmax(0, 1fr)); border-color: var(--done); }
.pseg { min-width: 0; height: 100%; padding: 0; overflow: hidden; display: grid; grid-auto-flow: column; place-content: center; border-radius: 3px;
  background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line);
  font-size: 11px; font-weight: 600; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.pbar > .pseg:first-child { border-radius: 999px 3px 3px 999px; }
.pbar > .pseg:last-child { border-radius: 3px 999px 999px 3px; }
.pseg:hover:not(:disabled) { box-shadow: inset 0 0 0 1.5px var(--accent); color: var(--ink); }
.pseg:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 1px; position: relative; z-index: 1; }
.pseg.tc { font-size: 11px; }
.pseg.st.on { background: var(--accent); color: var(--on-accent); box-shadow: none; }
.pseg.tc.on { background: var(--done); color: var(--on-done); box-shadow: none; }
.pseg.st.cur, .pseg.tc.cur { font-weight: 800; }   /* current step: last filled cell, in bold (no outline) */
.pseg.nine { grid-row: 1; grid-column: 10; height: var(--barh); min-width: max-content; margin-left: 8px; padding: 0 9px; border-radius: 999px;
  box-shadow: none; border: 1.5px dashed var(--faint); white-space: nowrap; }
.pseg.nine:hover:not(:disabled) { border-color: var(--late); color: var(--late); box-shadow: none; }
.pseg.nine.on { background: var(--late); border: 1.5px solid var(--late); color: #fff; }
.pseg.nine .short { display: none; }
.prog.is-out .pbar.st { border-color: var(--line); }
.prog.is-out .pbar.st .pseg { background: var(--bg); color: var(--faint); box-shadow: none; text-decoration: line-through; }
.olbl { grid-row: 3; grid-column: 7 / span 3; font-size: 10.5px; font-weight: 600; line-height: 1.2; color: var(--accent-text); text-align: center; white-space: nowrap; }
/* MEDDPICC: strip of eight letter tiles at the bottom of each deal, an evidence panel, and the notes dialog */
.meddp { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; padding-top: 14px; border-top: 1px dashed var(--line); }
.mhead { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; }
.mhead .mt { font-size: 11px; font-weight: 700; letter-spacing: .14em; color: var(--accent-text); }
.msum { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.mhead .madd { margin-left: auto; }
.mstrip { container-type: inline-size; }
.mgrid { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
.mtile { position: relative; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 9px 10px 10px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); text-align: left; }
.mtile:hover:not(:disabled) { border-color: var(--accent); }
.mtile.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.mletter { font-size: 22px; font-weight: 800; line-height: 1; color: var(--ink); }
.mname { font-size: 11.5px; font-weight: 600; line-height: 1.25; color: var(--muted); }
.mnext { margin-top: 2px; font-size: 11.5px; line-height: 1.35; color: var(--ink); overflow-wrap: anywhere; }
.mchev { position: absolute; right: 6px; bottom: 6px; width: 20px; height: 20px; display: grid; place-items: center; border-radius: 6px;
  color: var(--accent-text); background: var(--accent-soft); opacity: 0; transition: opacity .12s; }
.mtile:hover .mchev, .mtile:focus-visible .mchev, .mtile[aria-expanded="true"] .mchev { opacity: 1; }
.mtile[aria-expanded="true"] .mchev svg { transform: rotate(180deg); }
@media (hover: none) { .mchev { opacity: .8; } }
.mrisk { position: absolute; top: 7px; right: 7px; width: 16px; height: 16px; display: grid; place-items: center; border-radius: 50%; background: var(--late); color: #fff; font-size: 11px; font-weight: 800; }
.mmeter { display: inline-flex; align-items: center; gap: 6px; }
.mdots { display: inline-flex; gap: 3px; }
.mdots i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid currentColor; }
.mdots i.on { background: currentColor; }
.lv-none .mmeter, .mmeter.lv-none { color: var(--faint); }
.lv-gap .mmeter, .mmeter.lv-gap { color: var(--late); }
.lv-partial .mmeter, .mmeter.lv-partial { color: var(--amber); }
.lv-strong .mmeter, .mmeter.lv-strong { color: var(--done); }
.mlvl { font-size: 12px; font-weight: 700; }
@container (max-width: 960px) { .mnext { display: none; } }                       /* tight: drop the next step first... */
@container (max-width: 560px) { .mgrid { grid-template-columns: repeat(4, minmax(0, 1fr)); } .mnext { display: block; } }
@container (max-width: 480px) { .mnext { display: none; } }
@container (max-width: 360px) { .mname { display: none; } .mtile { align-items: center; } }   /* ...then the name, never the letter or dots */
.mpanel { container-type: inline-size; display: flex; flex-direction: column; gap: 10px; }
.mp-head { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; }
.mp-head .mp-hint { flex: 1; font-size: 12.5px; color: var(--muted); }
/* same 8-column grid and gap as the tiles, so each letter's bullets sit directly below it */

  }

  el.append(h('section', null, h('h3', { text: 'Notes' }),
    h('textarea', { class: 'fld' + (F.has('notes') ? ' hl' : ''), id: 'ed-notes', rows: '3', disabled: ro, placeholder: 'Context, next steps, who you’re waiting on…', oninput: (e) => { d.notes = e.target.value; scheduleSave(); } }, d.notes || '')));

  const who = [];
  if (live.createdBy || live.createdAt) who.push(`Added by ${personName(live.createdBy)}${live.createdAt ? ' ' + ago(live.createdAt) : ''}`);
  if (live.updatedAt && live.updatedAt !== live.createdAt) who.push(`last edited by ${personName(live.updatedBy)} ${ago(live.updatedAt)}`);
  const foot = h('div', { class: 'edfoot' }, h('span', { class: 'who', text: who.join(' · ') }));
  if (!ro) {
    if (ED.confirmDel) foot.append(h('span', { class: 'confirm' }, `Delete this ${VIEWS[kind].noun}?`,
      h('button', { class: 'btn danger solid', text: 'Delete', onclick: () => { const id = ED.id; commit(kind, id, (x) => { x.deleted = true; }); closeEditor(); toast(`Deleted. ${VIEWS[kind].noun === 'deal' ? 'Deal' : 'Task'} removed from the list.`); } }),
      h('button', { class: 'btn', text: 'Cancel', onclick: () => { ED.confirmDel = false; buildEditor(); } })));
    else foot.append(h('button', { class: 'btn danger', text: 'Delete', onclick: () => { ED.confirmDel = true; buildEditor(); } }));
  }
  foot.append(h('button', { class: 'btn primary', text: 'Done', onclick: () => closeEditor() }));
  el.append(foot);
  ED.shown = JSON.stringify(live);
}

/* react to remote changes for the open item without disturbing typing */
function syncEditor() {
  if (!ED) return;
  const it = S.items[ED.kind].get(ED.id);
  if (!it) { closeEditor(true); return; }
  if (ED.dirty || DRAG || ED.el.contains(document.activeElement)) return;
  const s = JSON.stringify(it);
  if (s === ED.shown) return;
  ED.base = clone(it); ED.draft = clone(it);
  buildEditor();
}
document.addEventListener('focusout', () => setTimeout(syncEditor, 50));

/* ================= misc ui ================= */
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3800); }
function go(view) {
  if (!VIEWS[view]) view = 'deals';
  if (ED && ED.kind !== view) closeEditor(true);
  S.view = view; S.confirmClear = false;
  try { if (location.hash !== '#' + view) history.replaceState(null, '', '#' + view); } catch {}
  render();
}
document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => go(t.dataset.view)));
window.addEventListener('hashchange', () => go(location.hash.slice(1)));
$('#q').addEventListener('input', (e) => { S.q = e.target.value; if (ED) closeEditor(true); render(); });
$('#sort').value = S.sort;
$('#sort').addEventListener('change', (e) => { S.sort = e.target.value; ls.set('crm.sort', S.sort); render(); });
$('#addIn').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const v = e.target.value.trim(); if (!v || !S.store) return;
  e.preventDefault();
  const kind = S.view, id = createItem(kind, v);
  e.target.value = '';
  if (kind === 'deals') {
    const tryOpen = (n) => { if (S.items.deals.has(id)) { S.adding = { kind: 'deals', id, focus: true }; render(); } else if (n < 40) setTimeout(() => tryOpen(n + 1), 50); };
    tryOpen(0);
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && ED) closeEditor(); });
setInterval(() => { if (!ED || !ED.el.contains(document.activeElement)) render(); }, 60000);

/* ================= theme switch (remembered in this browser) ================= */
function applyTheme(t) {
  if (!['light', 'dark', 'auto'].includes(t)) t = 'auto';
  if (t === 'auto') document.documentElement.removeAttribute('data-ui-theme');
  else document.documentElement.setAttribute('data-ui-theme', t);
  document.querySelectorAll('.theme button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.t === t)));
}
applyTheme(ls.get('crm.theme', 'auto'));
document.querySelectorAll('.theme button').forEach((b) => b.addEventListener('click', () => { ls.set('crm.theme', b.dataset.t); applyTheme(b.dataset.t); }));

/* ================= boot ================= */
async function boot() {
  go(location.hash.slice(1) || 'deals');
  const timer = setTimeout(() => { S.timedOut = true; render(); }, 10000);
  let store = null;
  if (window.claude && typeof window.claude.use === 'function') {
    try { store = await remoteStore(); } catch (e) { console.warn(e); }
    if (!store) { clearTimeout(timer); S.mode = 'off'; S.timedOut = true; S.canWrite = false; render(); return; }
  } else store = localStore();
  S.store = store; S.me = store.me; S.canWrite = store.canWrite; S.mode = store.mode;
  render();
  for (const kind of ['deals', 'tasks']) {
    store.sub(kind, (docs) => {
      const m = new Map(docs.map((d) => [d.id, d]));
      S.items[kind] = m; S.loaded[kind] = true;
      if (S.loaded.deals && S.loaded.tasks) clearTimeout(timer);
      render(); syncEditor();
    }, (err) => { console.warn(err); S.loaded[kind] = true; toast('Lost the connection to the shared list. Reload the page to reconnect.'); render(); });
  }
  store.subUser((data, fromCache) => {
    if (data) { S.user = { baseline: data.baseline || 0, seen: data.seen || {} }; S.userExists = true; S.userLoaded = true; }
    else if (!fromCache) {
      S.userExists = false; S.userLoaded = true;
      if (S.me && !S.user.baseline) {
        // first visit: start highlighting from now so existing items aren't all flagged as new
        S.user = { baseline: Date.now(), seen: {} };
        enqueue('user', () => store.setUser(S.user)).then(() => { S.userExists = true; }).catch((e) => console.warn(e));
      }
    }
    render();
  });
}
boot();
})();
</script>
